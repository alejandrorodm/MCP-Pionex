[project]
name = "mcp-pionex"
version = "1.0.0"
description = "MCP server for the Pionex exchange, built on pionex_py, with strict anti-hallucination guardrails"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alejandro Rodríguez Moreno", email = "alejandrorodm@proton.me" }]
keywords = ["mcp", "pionex", "crypto", "trading", "model-context-protocol"]
dependencies = [
    "mcp>=2.0.0",
    "pionex_py>=1.2.0",
]

[project.urls]
Repository = "https://github.com/alejandrorodm/MCP-Pionex"

[project.scripts]
mcp-pionex = "mcp_pionex.server:main"

# Local development against a checkout of pionex_py: uncomment the override.
# [tool.uv.sources]
# pionex_py = { path = "../pionex_py" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_pionex"]
